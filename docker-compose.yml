# Local-dev dependencies for the Testers API.
# Brings up MySQL 8, RabbitMQ (with management UI + delayed-message plugin), and Redis 7.
# Run with: docker compose up -d

services:
  mysql:
    image: mysql:8.0
    container_name: testers-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: testers
      MYSQL_PASSWORD: changeme
      MYSQL_DATABASE: app_db   # creates app_db; testplan_db created by init.sql
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/mysql-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    # The "-management" tag includes the web UI on port 15672 (guest/guest by default).
    # We use plain rabbitmq:3-management here; for the delayed-message plugin used in our
    # retry strategy, swap to a custom image with the plugin enabled. Documented in
    # ARCHITECTURE.md "The outbox pattern".
    image: rabbitmq:3-management-alpine
    container_name: testers-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Management UI (http://localhost:15672)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: testers-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
